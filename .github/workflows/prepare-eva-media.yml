name: Prepare canonical EVA media
on:
  push:
    branches:
      - build/eva-salon-site
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert and arrange client media
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare-eva-media.py
      - name: Commit canonical media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare canonical EVA media"
          git push origin "HEAD:${GITHUB_REF_NAME}"
